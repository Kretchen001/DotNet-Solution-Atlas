name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  analyzer:
    name: Analyzer (build and tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build analyzer/Atlas.Analyzer -c Release
      - name: Test
        run: dotnet test analyzer/Atlas.Analyzer.Tests -c Release

  extension:
    name: Extension (compile and tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      - run: npm run compile
      - run: npm test
